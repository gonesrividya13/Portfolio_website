<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .v-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-weight: 800;
      font-size: 75px;
      fill: #0f172a; 
    }
    .dot {
      fill: #737373; 
    }
    @media (prefers-color-scheme: dark) {
      .v-text {
        fill: #ffffff;
      }
    }
  </style>
  <text x="50" y="78" class="v-text" text-anchor="middle">V<tspan class="dot">.</tspan></text>
</svg>
