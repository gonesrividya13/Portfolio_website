name: Backend Tests Pipeline

on:
  push:
    branches:
      - main
      - 'feat/*'
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Maven Tests
        run: |
          cd backend
          mvn test
