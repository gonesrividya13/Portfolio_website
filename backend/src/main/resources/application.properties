spring.application.name=backend
spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# ElevenLabs Custom Cloned Voice Credentials
elevenlabs.api.key=${ELEVENLABS_API_KEY:}
elevenlabs.voice.id=${ELEVENLABS_VOICE_ID:}

# Listen on the port assigned by Railway (defaults to 8080 locally)
server.port=${PORT:8080}
